name: Android debug build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list asks for the retired 'tools' package, which no longer exists.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: airlock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to the Releases page
        # One fixed link: https://github.com/vspayce/airlock-android/releases/latest/download/airlock.apk
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/*.apk airlock.apk
          gh release create "build-${{ github.run_number }}" airlock.apk --target "${{ github.sha }}" --latest \
            --title "Airlock for Android (build ${{ github.run_number }})" \
            --notes "Download airlock.apk on your phone and open it (allow installing unknown apps). Uninstall the previous test build first."
